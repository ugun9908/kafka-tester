# application.properties with environment variables
spring.application.name=universal-consumer

# Consumer Kafka Configurations
app.kafka.consumer.topic=product.fct.sysco-list-header.0
app.kafka.consumer.group.id=order.cmd.susrelease-failure-listener
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
app.kafka.concurrency=1
app.kafka.static.consumer.enabled=false

# Deserializer Configuration
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=false

